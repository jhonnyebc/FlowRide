# Tema de FlowRide para las pantallas de Keycloak del operador (inicio de sesión, TOTP, contraseña). Hereda la estructura
# de keycloak.v2 y solo cambia la apariencia, con la misma identidad del Panel Web: blanco y negro, plano, Overpass.
# La herramienta de aprovisionamiento lo asigna a cada realm (FlowRide:Identidad:TemaInicioSesion).
parent=keycloak.v2
import=common/keycloak

# css/styles.css es el de keycloak.v2 (se resuelve en el tema padre); flowride.css va encima.
styles=css/styles.css css/flowride.css

darkMode=true
