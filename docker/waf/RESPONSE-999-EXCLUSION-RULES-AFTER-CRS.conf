# Exclusiones de FlowRide sobre el OWASP Core Rule Set (se cargan después de sus reglas).
# Cada exclusión es lo más estrecha posible: quita un solo parámetro de una sola regla, nunca la regla entera.

# Regreso del inicio de sesión al Panel Web: Keycloak agrega el parámetro estándar "iss" (RFC 9207, emisor del realm).
# En local su valor es http://localhost:8080/realms/..., que la regla 934110 (SSRF hacia URL internas o de metadatos
# de la nube) toma como ataque. El panel no usa ese valor para pedir nada al servidor; solo lo compara con su emisor.
SecRuleUpdateTargetById 934110 "!ARGS:iss"
