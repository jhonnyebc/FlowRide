# Entorno local de FlowRide.
# Un servidor PostgreSQL compartido (ADR-0010 §5) con:
#   flowride_catalogo     → catálogo de plataforma (operadores; sin datos operacionales), creado al iniciar el volumen
#   flowride_<tenant>     → un Silo por operador, con su propio rol, creado por la herramienta de aprovisionamiento
# Keycloak (un realm por operador) y Mailpit (correos de Keycloak en local). Azurite (documentos, ADR-0013).
# Las contraseñas se leen de .env, que no se versiona (ADR-0014).
services:
  postgres:
    image: postgres:17
    container_name: flowride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: postgres
      CATALOGO_DB_PASSWORD: ${CATALOGO_DB_PASSWORD:?Define CATALOGO_DB_PASSWORD en .env}
    ports:
      # 5433 en el host para no chocar con un PostgreSQL instalado localmente en 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - flowride-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Identidad (ADR-0003): un realm por operador, que crea la herramienta de aprovisionamiento.
  # Modo desarrollo con su propio almacenamiento en un volumen; en la nube usa su propia base (Fase 12).
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: flowride-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?Define KEYCLOAK_ADMIN_USER en .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD en .env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - flowride-keycloak-data:/opt/keycloak/data
    depends_on:
      - mailpit

  # Almacenamiento de objetos (ADR-0013): emulador de Azure Blob Storage, un bucket por operador.
  # La cuenta de desarrollo es la pública de Azurite ("UseDevelopmentStorage=true"); no es un secreto.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: flowride-azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - flowride-azurite-data:/data

  # Correos de Keycloak (definir o recuperar la contraseña) atrapados en local: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27.7
    container_name: flowride-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  flowride-pgdata:
  flowride-keycloak-data:
  flowride-azurite-data:
